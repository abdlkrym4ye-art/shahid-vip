<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إشعار انتقال المحل</title>
    <style>
        .shop-notice-card {
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            color: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            font-family: 'Cairo', 'Tajawal', sans-serif;
            text-align: center;
            max-width: 480px;
            margin: 20px auto;
            border: 2px solid #e94560;
            position: relative;
            overflow: hidden;
        }
        .shop-notice-card::before {
            content: "🎬";
            position: absolute;
            font-size: 120px;
            opacity: 0.05;
            top: -20px;
            right: -20px;
        }
        .notice-badge {
            background-color: #e94560;
            color: #ffffff;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(233, 69, 96, 0.4);
        }
        .notice-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #ffffff;
            letter-spacing: 0.5px;
        }
        .notice-body {
            font-size: 16px;
            line-height: 1.8;
            color: #e0e0e0;
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-right: 4px solid #e94560;
            text-align: right;
        }
        .notice-address-title {
            color: #f39c12;
            font-weight: bold;
            margin-bottom: 5px;
            display: block;
        }
        .notice-footer {
            font-size: 15px;
            color: #a0aec0;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="shop-notice-card">
    <div class="notice-badge">✨ تنبيه هام لعملاءنا الكرام ✨</div>
    <div class="notice-title">المحل مغلق مؤقتاً</div>
    <div class="notice-body">
        نحيطكم علماً بأنه سيتم نقل المحل (الخاص بنسخ المسلسلات والأفلام) إلى العنوان الجديد:<br><br>
        <span class="notice-address-title">📍 العنوان الجديد:</span>
        الشارع العام - جوار محلات الفقيه ومنصور للخدمات الزراعية - أمام عيادة غزة.
    </div>
    <div class="notice-footer">وشكرا لكم لحسن تفهمكم، ونتشرف بزيارتكم قريباً! 🍿🔥</div>
</div>

</body>
</html>
